# GawharaMagic 2.0 - Mana is read from AuraSkills (Wisdom determines max mana).
mana:
  level-scale: 1.25
  base-move: 8.0
  weapon: 18.0
  spin: 28.0
  ultimate: 72.0
  guard: 18.0
  awakening: 90.0
  fusion: 38.0
  forbidden: 82.0
  relic: 20.0
  transformation: 60.0

cooldowns:
  weapon-base: 8
  weapon-per-tier: 3
  spin: 18
  ultimate: 180
  guard: 28
  awakening: 300
  fusion: 90
  forbidden: 240
  relic: 40
  transformation: 180

requirements:
  ultimate-level: 60
  awakening-level: 100
  forbidden-level: 75
  forbidden-reputation: 100
  transformation-level: 80
  transformation-reputation: 150

guard:
  duration-seconds: 5
  damage-multiplier: 0.35

awakening:
  duration-seconds: 30
  mana-cost-multiplier: 0.85
  damage-multiplier: 0.75

forbidden:
  duration-seconds: 14

transformation:
  duration-seconds: 35

bounty:
  reputation-reward: 40

# Spirit companion periodically restores a small amount of AuraSkills mana.
spirit:
  mana-interval-seconds: 60
  mana-restore-percent: 2.5

# Reputation needed to claim each reusable elemental relic once.
relics:
  tide-reputation: 100
  focus-reputation: 200
  guardian-reputation: 350

# ---------------------------------------------------------------
# وضع القوة (2.1.0) — بديل الأسلحة. كل القدرات بمانا قليلة وتتخصم من AuraSkills.
# F = تشغيل/إيقاف | سكرول = تبديل القدرة | كليك يمين = استخدام | كليك شمال = ضربة بقوتك
# ---------------------------------------------------------------
power:
  cost-multiplier: 1.0      # 0.5 = نص المانا، 2.0 = ضعف المانا
  strike-mana: 1.5          # مانا الضربة بالقوة (كليك شمال على هدف)
  strike-cooldown-ms: 700
  # مانا كل قدرة من الثلاث (بالترتيب)
  costs:
    FIRE: [6, 4, 8]
    WATER: [4, 5, 5]
    EARTH: [4, 5, 7]
    WIND: [3, 3, 7]
    LIGHTNING: [4, 5, 7]
    SHADOW: [5, 4, 6]
    ICE: [5, 4, 7]
    METAL: [5, 5, 6]
    NATURE: [5, 6, 5]
    LIGHT: [4, 5, 6]
    SOUND: [3, 5, 6]
    CRYSTAL: [4, 5, 6]
  # الكولداون بالثواني لكل قدرة
  cooldowns:
    FIRE: [12, 2, 10]
    WATER: [4, 7, 12]
    EARTH: [4, 14, 10]
    WIND: [3, 5, 12]
    LIGHTNING: [3, 6, 14]
    SHADOW: [6, 4, 16]
    ICE: [8, 3, 14]
    METAL: [12, 7, 8]
    NATURE: [8, 12, 7]
    LIGHT: [8, 4, 14]
    SOUND: [3, 5, 10]
    CRYSTAL: [3, 14, 10]
