# GawharaMagic 2.3.10 - Elemental Spinjitzu, 50 move unlocks, evolved flight, environmental affinities,
# no cooldowns, OP mana bypass, and Bedrock touch controls.
# Spinjitzu-style elemental tornado. Re-activate the skill to stop it early.
spin:
  duration-seconds: 5
  radius: 3.4
  damage-per-pulse: 1.5
  damage-per-tier: 0.2
  pulse-interval-ticks: 20
  knockback: 0.68

mana:
  level-scale: 1.25
  base-move: 8.0
  weapon: 18.0
  spin: 28.0
  ultimate: 72.0
  guard: 18.0
  awakening: 90.0
  fusion: 38.0
  forbidden: 82.0
  relic: 20.0
  transformation: 60.0

requirements:
  ultimate-level: 60
  awakening-level: 100
  forbidden-level: 75
  forbidden-reputation: 100
  transformation-level: 80
  transformation-reputation: 150

guard:
  duration-seconds: 5
  damage-multiplier: 0.35

awakening:
  duration-seconds: 30
  mana-cost-multiplier: 0.85
  damage-multiplier: 0.75

forbidden:
  duration-seconds: 14

transformation:
  duration-seconds: 35

bounty:
  reputation-reward: 40

# Spirit companion periodically restores a small amount of AuraSkills mana.
spirit:
  mana-interval-seconds: 60
  mana-restore-percent: 2.5

# Reputation needed to claim each reusable elemental relic once.
relics:
  tide-reputation: 100
  focus-reputation: 200
  guardian-reputation: 350

# ---------------------------------------------------------------
# وضع القوة (2.3.3) — 130 قدرة: 10 مستقلة لكل عنصر. الاستخدام بلا كولداون؛ المانا هي حد الاستخدام.
# F = تشغيل/إيقاف | سكرول = تبديل القدرة (10 قدرات لكل عنصر) | كليك يمين = استخدام | كليك شمال = ضربة بقوتك
# ---------------------------------------------------------------
power:
  cost-multiplier: 1.0      # 0.5 = نص المانا، 2.0 = ضعف المانا
  strike-mana: 1.5          # مانا الضربة بالقوة (كليك شمال على هدف)
  # مانا القدرات 1..10. العناصر الأصلية: 3 قدرات أصلية + 7 مستقلة؛ التحول: 10 قدرات أشكال مستقلة.
  costs:
    FIRE: [6, 4, 8, 5, 5, 6, 5, 7, 8, 10]
    WATER: [4, 5, 5, 5, 6, 6, 5, 7, 6, 10]
    EARTH: [4, 5, 7, 5, 6, 5, 6, 6, 8, 10]
    WIND: [3, 3, 7, 4, 5, 4, 6, 5, 7, 10]
    LIGHTNING: [4, 5, 7, 5, 5, 7, 6, 6, 8, 10]
    SHADOW: [5, 4, 6, 5, 6, 5, 7, 6, 8, 10]
    ICE: [5, 4, 7, 5, 5, 6, 6, 6, 7, 10]
    METAL: [5, 5, 6, 5, 6, 6, 5, 6, 7, 10]
    NATURE: [5, 6, 5, 5, 5, 6, 6, 7, 7, 10]
    LIGHT: [4, 5, 6, 5, 5, 6, 6, 7, 6, 10]
    SOUND: [3, 5, 6, 5, 5, 4, 6, 6, 7, 10]
    CRYSTAL: [4, 5, 6, 5, 6, 6, 6, 7, 6, 10]
    SHAPESHIFT: [5, 9, 5, 6, 10, 12, 8, 9, 14, 8]


# تقدم الحركات: حركة/تقنية جديدة عند كل مستوى من 1 إلى 50.
# المستويات 51..100 لا تفتح حركات جديدة؛ ترفع قوة الحركات الحالية تدريجيًا.
progression:
  move-unlocks-max-level: 50
  power-scaling-start-level: 51
  power-scaling-step-levels: 10

# الطيران المستمر: Shift للإيقاف. الرياح اقتصادية جدًا؛ النار أسرع وتستهلك مانا أكثر.
# مراحل تطور الهيئة: 1..14، 15..29، 30..100.
flight:
  second-stage-level: 15
  third-stage-level: 30
  wind:
    activation-cost: 0.5
    mana-per-drain: 0.15
    drain-interval-ticks: 40
  fire:
    activation-cost: 4.0
    mana-per-drain: 0.8
    drain-interval-ticks: 20

# ---------------------------------------------------------------
# تعزيز العناصر حسب البيئة
# عند تحقق شرط العنصر، تقوى قدراته بحسب المضاعف المحدد أدناه.
# التأثير يطبق على الضرر والشفاء ومدد التجميد/الإبطاء وسرعة الحركة والاندفاع.
environmental-bonus:
  enabled: true
  default-multiplier: 1.25
  cache-ms: 500
  multipliers:
    FIRE: 1.25
    WATER: 1.25
    EARTH: 1.25
    WIND: 1.25
    LIGHTNING: 1.30
    SHADOW: 1.25
    ICE: 1.25
    METAL: 1.25
    NATURE: 1.25
    LIGHT: 1.25
    SOUND: 1.25
    CRYSTAL: 1.25
    SHAPESHIFT: 1.00
