name: GawharaMagic
main: gawhara.magic.Magic
version: 1.2
api-version: '1.21'
author: Gawhara
description: Six magic elements, 100 levels, secret elemental trials, and /grestore.
commands:
  gmagic:
    description: Open the magic GUI, status, and secret trials
    usage: /gmagic [task|weapons|reset <player>|level <player> <1-100>]
    aliases: [magic]
  grestore:
    description: Get back everything you lost when you died
    usage: /grestore
permissions:
  gawhara.magic.admin:
    description: Admin commands for GawharaMagic
    default: op
