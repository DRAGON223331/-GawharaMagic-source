name: GawharaMagic
main: gawhara.magic.Magic
version: 1.0
api-version: '1.21'
author: Gawhara
description: Magic elements, level weapons that survive death, and /grestore.
commands:
  gmagic:
    description: Open the magic GUI / status / weapons
    usage: /gmagic [weapons|reset <player>|level <player> <1-5>]
    aliases: [magic]
  grestore:
    description: Get back everything you lost when you died
    usage: /grestore
permissions:
  gawhara.magic.admin:
    description: Admin commands for GawharaMagic
    default: op
