name: GawharaMagic
main: gawhara.magic.Magic
version: 2.3.2
api-version: '1.21'
depend: [AuraSkills]
softdepend: [LibsDisguises]
author: Gawhara
description: Thirteen elemental schools including ten kill-learned shapeshift forms, individually implemented abilities, AuraSkills mana, relics, spirit companions, and transformations.
commands:
  gmagic:
    description: Open the magic GUI, status, and secret trials
    usage: /gwm [pw|next|prev|use|ab|forms|unmorph|m|s|g|u|a|f|mn|fu|tr|b|rep|task|powers|reset <player>|level <player> <1-100>]
    aliases: [magic, gwm]
  grestore:
    description: Get back everything you lost when you died
    usage: /grestore
permissions:
  gawhara.magic.admin:
    description: Admin commands for GawharaMagic
    default: op
